apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  namespace: agent-space
  name: pod-creator-role
rules:
- apiGroups: [""]
  resources: ["pods", 'persistentvolumeclaims', 'namespaces', 'services']
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["apps"]  # API group for Deployments
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-creator-binding
  namespace: agent-space
subjects:
- kind: ServiceAccount
  name: my-service-account  # The service account to bind to
  namespace: agent-space      # The namespace where the service account exists
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-creator-role     # The role to bind
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-service-account
  namespace: agent-space
